name: Deploy protected dashboard entry

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare protected Site entry page
        run: |
          mkdir -p site-dist
          cat > site-dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta name="robots" content="noindex,nofollow,noarchive">
            <meta http-equiv="refresh" content="0;url=https://property-central-command-os.whole-isle-6550.chatgpt.site">
            <link rel="canonical" href="https://property-central-command-os.whole-isle-6550.chatgpt.site">
            <title>Property Central Command OS</title>
            <style>
              body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f5f7;color:#132238;font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
              main{max-width:560px;margin:24px;padding:32px;border:1px solid #dce2e8;border-radius:18px;background:#fff;box-shadow:0 12px 32px rgba(14,31,53,.08);text-align:center}
              a{display:inline-block;margin-top:12px;padding:11px 16px;border-radius:10px;background:#0b1728;color:#fff;text-decoration:none;font-weight:700}
              p{color:#667085}
            </style>
          </head>
          <body>
            <main>
              <h1>Property Central Command OS</h1>
              <p>The dashboard is hosted on the protected Site. A shared password is required; no ChatGPT or GitHub account is needed.</p>
              <a href="https://property-central-command-os.whole-isle-6550.chatgpt.site">Open protected dashboard</a>
            </main>
            <script>location.replace("https://property-central-command-os.whole-isle-6550.chatgpt.site");</script>
          </body>
          </html>
          HTML
          touch site-dist/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload entry page
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
